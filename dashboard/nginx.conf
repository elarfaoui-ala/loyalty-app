server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Same-origin API access: the dashboard is built with VITE_API_BASE=/api/v1,
  # so /api/* is proxied to the API service (no CORS needed on this origin).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger UI served by the API.
  location = /docs {
    return 301 /docs/;
  }
  location /docs/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # Hashed assets are immutable once deployed.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
