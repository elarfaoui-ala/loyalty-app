name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, build, unit + e2e tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: loyalty
          POSTGRES_DB: loyalty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loyalty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://loyalty:loyalty@localhost:5432/loyalty?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      CUSTOMER_TOKEN_SECRET: ci-customer-secret-0123456789abcdef
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: E2E tests
        run: npm run test:e2e

  frontends:
    name: Widget + Dashboard (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            widget/package-lock.json
            dashboard/package-lock.json
      - name: Widget
        working-directory: widget
        run: |
          npm ci
          npm run lint:check
          npm run build
      - name: Dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run lint:check
          npm run build